[package]
name = "verifier-core"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bitcoin = { workspace = true }
ddk-dlc = { workspace = true }
ddk-messages = { workspace = true }
hex = { workspace = true }
lightning = { workspace = true }
secp256k1-zkp = { workspace = true }
sha2 = { workspace = true }
verifier-schema = { path = "../verifier-schema" }

[lints]
workspace = true

[dev-dependencies]
# Only to check that reconstruction builds what DDK's own contract builder builds.
ddk-manager = { version = "=2.0.0-rc.9", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
verifier-policy = { path = "../verifier-policy" }
