[package]
name = "dlc-verify-tvc"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "json", "macros"] }
clap = { version = "4", features = ["derive"] }
hex = { workspace = true }
metrics = { path = "../metrics" }
qos_core = { workspace = true }
qos_hex = { workspace = true }
qos_json = { workspace = true }
qos_p256 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower = { workspace = true, features = ["limit", "timeout"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
verifier-core = { path = "../verifier-core" }
verifier-policy = { path = "../verifier-policy" }
verifier-schema = { path = "../verifier-schema" }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
turnkey_client = { workspace = true }
turnkey_proofs = { workspace = true }

[lints]
workspace = true
