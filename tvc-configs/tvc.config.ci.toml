# Turnkey CLI config used by CI. Everything here is public: operator ids, wallet ids, and the
# hosted operators' public keys. scripts/tvc-release.sh fills __ORG_ID__ and __API_KEY_PATH__ at run
# time from the TVC_* secrets. Hosted operators must be listed here for `tvc deploy approve --operator-id` to work;
# env-var auth alone cannot load them.
version = 1
active_org = "ci"

[orgs.ci]
id = "__ORG_ID__"
api_key_path = "__API_KEY_PATH__"
api_base_url = "https://api.turnkey.com"
default_operator_kind = "hosted"

