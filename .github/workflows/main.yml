name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          components: clippy, rustfmt
      - name: Run linters
        run: make lint
      - name: Run tests
        run: make test
      - name: Checkout frozen DLC Verify compatibility target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: LygosLabs/dlc-verify
          ref: e46703e7adf21ce407e150d4f46ff455ba46fd57
          path: compatibility-target
          persist-credentials: false
      - name: Build frozen TypeScript compatibility target
        working-directory: compatibility-target
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run cross-language differential check
        run: node scripts/differential/compare-pr9.mjs compatibility-target
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit locked dependency graph
        run: cargo audit
